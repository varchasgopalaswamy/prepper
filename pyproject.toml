[project]
name = "prepper"
authors = [{ name = "Varchas Gopalaswamy", email = "varchas@gopalaswamy.org" }]
description = "Allows python objects to be stored and loaded from an HDF5 file in a language-agnostic manner"
readme = "README.md"
# Revisit once Python 3.15 wheels are available: https://github.com/h5py/h5py/issues/2972
requires-python = ">=3.14,<3.15"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "numpy",
    "pydantic-settings>=2.15.0",
    "h5py >= 3.8.0",
    "loguru >= 0.6.0",
    "aenum >= 3.1.11",
]
dynamic = ["version"]

[project.optional-dependencies]
xarray = ["xarray", "h5netcdf"]
units = ["pint>=0.26.1"]
uncertainties = ["auto_uncertainties"]
periodictable = ["periodictable"]
equinox = ["equinox", "jax"]

[dependency-groups]
ci = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.169.0",
    "xarray",
    "h5netcdf",
    "auto_uncertainties",
    "periodictable",
    "equinox",
    "pint>=0.26.1",
    "ruff>=0.17.0",
    "pyrefly>=1.3.2",
    "prek>=0.5.5",
]
release = ["build>=1.6.1", "twine>=7.0.0"]

[build-system]
requires = ["setuptools>=84.0.0", "setuptools_scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "prepper/_version.py"

[tool.setuptools.packages.find]
include = ["prepper", "prepper.*"]

[tool.coverage.run]
branch = true
source = ["prepper"]
omit = ["*/tests/*", "*/__init__.py", "*/_version.py"]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["prepper/tests"]
